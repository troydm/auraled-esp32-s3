<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AuraLED</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body class="d-flex align-items-center py-4 bg-body-tertiary">
<!-- header -->

    <style>
        .form-settings {
            max-width: 450px;
            padding: 1rem;
        }

        .form-settings-label {
            font-weight: bold;
        }

        .form-settings-first-col {
            max-width: 120px;
        }
    </style>

    <main class="form-settings w-100 m-auto">
        <form class="needs-validation" action="/" method="POST">
            <div class="container">

                <div class="row g-3 align-items-center mb-2">
                    <div class="col-sm form-settings-label">
                        Aura LED Settings running on {hostname} hostname
                    </div>
                </div>

                <div class="row g-3 align-items-center">
                    <div class="col-sm form-settings-first-col">
                        <label for="inputHostname" class="col-form-label">Hostname</label>
                    </div>
                    <div class="col-lg">
                        <input type="text" id="inputHostname" name="hostname" value="{hostname}" class="form-control" required>
                    </div>
                </div>

                <div class="row g-3 align-items-center">
                    <div class="col-sm form-settings-first-col">
                        <label for="inputWifi" class="col-form-label">WiFi SSID</label>
                    </div>
                    <div class="col-lg">
                        <input type="text" id="inputWifi" name="wifiSSID" value="{wifiSSID}" class="form-control" required>
                    </div>
                </div>

                <div class="row g-3 align-items-center">
                    <div class="col-sm form-settings-first-col">
                        <label for="inputWifiPassword" class="col-form-label">WiFi Password</label>
                    </div>
                    <div class="col-lg">
                        <input type="password" id="inputWifiPassword" name="wifiPassword" value="{wifiPassword}" class="form-control" required>
                    </div>
                </div>

                <div class="row g-3 align-items-center">
                    <div class="col-sm form-settings-first-col">
                        <label for="inputLedPin" class="col-form-label">Led PIN</label>
                    </div>
                    <div class="col-lg">
                        <input type="text" id="inputLedPin" name="ledPin" value="{ledPin}" class="form-control" required>
                    </div>
                </div>

                <div class="row g-3 align-items-center">
                    <div class="col-sm form-settings-first-col">
                        <label for="inputLedNum" class="col-form-label">Led Nums</label>
                    </div>
                    <div class="col-lg">
                        <input type="text" id="inputLedNum" name="ledNum" value="{ledNum}" class="form-control" required>
                    </div>
                </div>

                <div class="row g-3 align-items-center">
                    <div class="col-sm form-settings-first-col">
                        <label for="inputPort" class="col-form-label">UDP Port</label>
                    </div>
                    <div class="col-lg">
                        <input type="text" id="inputPort" name="port" value="{port}" class="form-control" required>
                    </div>
                </div>
            </div>

            <button class="btn btn-primary w-100 mt-2" type="submit">Save Settings & Reboot</button>
        </form>
    </main>

<!-- footer -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
